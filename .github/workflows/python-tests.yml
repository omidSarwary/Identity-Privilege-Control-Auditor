name: python-tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - name: Run test-mode application flow
        run: python app.py --test --no-bootstrap

      - name: Verify report and alert outputs
        run: |
          test -f reports/final_identity_risk_report.txt
          test -f reports/final_identity_risk_report.json
          test -f reports/executive_summary.txt
          test -f data/alerts/alerts.json
          test -f logs/critical_alerts.log
