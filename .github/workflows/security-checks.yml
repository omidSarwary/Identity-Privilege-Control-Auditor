name: security-checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for obvious secret markers
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ \
            '(password[[:space:]]*=|api_key|secret|token)' app.py src bash powershell tests config; then
            echo "Potential secret markers were found."
            exit 1
          fi

      - name: Confirm tracked files do not include runtime output
        run: |
          set -euo pipefail
          tracked_files="$(git ls-files)"
          # Runtime folders may keep only .gitkeep markers under version control.
          tracked_runtime="$(git ls-files logs data/alerts data/collected data/normalized)"
          disallowed_runtime="$(printf '%s\n' "$tracked_runtime" | grep -Ev '(^|/)\.gitkeep$' || true)"
          if [ -n "$disallowed_runtime" ]; then
            echo "Tracked runtime files found under logs/ or data runtime folders:"
            printf '%s\n' "$disallowed_runtime"
            exit 1
          fi

          # Reports are generated at runtime. Only evidence placeholder .gitkeep
          # files are allowed to remain tracked inside reports/evidence/.
          tracked_reports="$(git ls-files reports)"
          disallowed_reports="$(printf '%s\n' "$tracked_reports" | grep -Ev '^reports/evidence(/[^/]+)*/\.gitkeep$|^reports/evidence/\.gitkeep$' || true)"
          if [ -n "$disallowed_reports" ]; then
            echo "Tracked report artifacts found under reports/:"
            printf '%s\n' "$disallowed_reports"
            exit 1
          fi

          if printf '%s\n' "$tracked_files" | grep -Fx 'project.md'; then
            echo "project.md must not be tracked."
            exit 1
          fi

          if printf '%s\n' "$tracked_files" | grep -Fx 'phased plan.md'; then
            echo "phased plan.md must not be tracked."
            exit 1
          fi

      - name: Check PowerShell and Python safety markers
        run: |
          set -euo pipefail
          grep -q 'Export-Csv -NoTypeInformation' powershell/windows_identity_audit.ps1
          ! grep -RIn --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ 'shell=True' src/core/command_runner.py
