name: verify-scripts

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify project structure
        run: |
          set -euo pipefail
          test -f app.py
          test -f requirements.txt
          test -f README.md
          test -f docs/ci_cd.md
          test -f bash/linux_identity_audit.sh
          test -f powershell/windows_identity_audit.ps1
          test -d src/core
          test -d src/collectors
          test -d src/parsers
          test -d src/analysis
          test -d src/reporting
          test -d src/utils
          test -d config/baselines
          test -d data/incoming
          test -d data/collected
          test -d data/normalized
          test -d data/alerts
          test -d logdata/linux
          test -d logdata/windows
          test -d logs/archive
          test -d reports/evidence/screenshots
          test -d reports/evidence/run_outputs
          test -d reports/evidence/sample_logs
          test -d tests/unit
          test -d tests/integration
          test -d tests/mockdata
          test -d docs

      - name: Verify Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile src/core/*.py src/collectors/*.py src/parsers/*.py src/analysis/*.py src/reporting/*.py src/utils/*.py

      - name: Check Bash syntax
        run: bash -n bash/linux_identity_audit.sh

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          if (Get-Command pwsh -ErrorAction SilentlyContinue) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path "powershell/windows_identity_audit.ps1"),
              [ref]$null,
              [ref]$null
            ) | Out-Null
          } else {
            Write-Host "pwsh not available; skipping PowerShell syntax check."
          }

      - name: Confirm required documentation and test folders
        run: |
          test -f README.md
          test -f requirements.txt
          test -d docs
          test -d tests/unit
          test -d tests/integration
          test -d tests/mockdata
